name: CI

on:
  push:
  pull_request:

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test
        run: dotnet test Ulric.sln --configuration Release

  web:
    name: Angular build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Ulric.Web/package-lock.json
      - name: Install
        working-directory: src/Ulric.Web
        run: npm ci
      - name: Build
        working-directory: src/Ulric.Web
        run: npm run build
