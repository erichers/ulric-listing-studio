<figure class="sun-study" [class.live]="live()">
  <div class="sun-stage">
    <svg class="sun-fallback" viewBox="0 0 320 180" role="img" aria-label="A simple house elevation used when the daylight study is still.">
      <line x1="16" y1="150" x2="304" y2="150" />
      <polygon points="118,92 160,58 202,92" />
      <rect x="124" y="92" width="72" height="58" />
      <circle cx="246" cy="48" r="10" />
    </svg>
    @if (!reduced) {
      <canvas #view aria-label="Daylight moving across a simple house massing"></canvas>
    }
  </div>
  <figcaption class="quiet">Massing only. Daylight moves from morning to afternoon. This is not a survey of the lot.</figcaption>
</figure>
