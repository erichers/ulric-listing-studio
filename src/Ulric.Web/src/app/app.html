<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
  <a class="wordmark" routerLink="/">Ulric <em>studio</em></a>
  <nav class="nav" aria-label="Studio">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Studio</a>
    <a class="nav-wide" routerLink="/builder" routerLinkActive="active">Builder</a>
    <a class="nav-wide" routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
  </nav>
  <button
    type="button"
    class="theme-toggle"
    (click)="theme.toggle()"
    [attr.aria-pressed]="theme.mode() === 'dark'"
    [attr.aria-label]="theme.mode() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
  >{{ theme.mode() === 'dark' ? 'Light' : 'Dark' }}</button>
  <details class="nav-more" #more>
    <summary aria-label="More pages">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6h14M3 10h14M3 14h14" /></svg>
    </summary>
    <div class="nav-menu" (click)="more.open = false">
      <a routerLink="/builder" routerLinkActive="active">Builder</a>
      <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
    </div>
  </details>
</header>
<main id="main">
  <router-outlet />
</main>
<footer class="site-footer">
  <div class="footer-row">
    <a class="wordmark" routerLink="/">Ulric <em>studio</em></a>
    <p class="quiet">A single-property listing studio.</p>
  </div>
</footer>
