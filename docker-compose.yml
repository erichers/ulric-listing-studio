services:
  ulric:
    build: .
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ConnectionStrings__Ulric: Data Source=/data/ulric.db
      Storage__Root: /data/uploads
      Geocoding__Enabled: "true"
      Geocoding__UserAgent: UlricListingStudio/1.0 (+https://github.com/erichers/ulric-listing-studio)
      Geocoding__BaseUrl: https://nominatim.openstreetmap.org
      Geocoding__MinIntervalMs: "1100"
      Notifier__Mode: log
      Cors__Origins__0: http://localhost:8080
    volumes:
      - ulric-data:/data

volumes:
  ulric-data:
